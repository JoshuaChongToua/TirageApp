<div class="bloc spe">
    <h5>{{title}}</h5>
    <drag-scroll [scrollbar-hidden]="true">
        @for (event of titres; track $index) {
            <div class="card" drag-scroll-item (click)="openDetail(event)">
                <div class="image-event">
                    <img src="{{event.poster_path ? 'https://image.tmdb.org/t/p/w342' + event.poster_path : '/shared/img/no-image.png' }}" alt="{{event.title ?? event.name}}">
                    <div class="card-overlay-text">
                        <div class="title">
                            {{event.title ?? event.name}}
                        </div>
                        <div class="info-event">
                            <span class="info">
                                {{ getGenres(event?.genre_ids?.[0] ?? event?.genres?.[0]?.id) }}
                                • {{ (event?.release_date || event?.first_air_date) | date: 'yyyy' }}
                            </span>
                            <span class="note">
                                <svg width="14" height="13" viewBox="0 0 14 13" fill="none"
                                        xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M2.55 12.6667L3.63333 7.98333L0 4.83333L4.8 4.41667L6.66667 0L8.53333 4.41667L13.3333 4.83333L9.7 7.98333L10.7833 12.6667L6.66667 10.1833L2.55 12.6667V12.6667"/>
                                </svg>
                                {{(Math.floor(event?.vote_average * 10) / 10) | number:'1.1-1'}}
                            </span>
                        </div>

                    </div>
                </div>

            </div>
        }
    </drag-scroll>
</div>
